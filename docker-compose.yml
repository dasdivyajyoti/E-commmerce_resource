
services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media_root
    environment:
      - ENVIRONMENT = production
    #command: gunicorn demo.wsgi:application --bind 0.0.0.0:8000 --workers 2
    command: sh ./entrypoint.prod.sh

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media_root
    depends_on:
      web:
        condition: service_healthy

volumes:
  static_volume:
  media_volume: